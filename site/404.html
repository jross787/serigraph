<style>
  :root {
    --base: #060708; --surface: #0C0E11; --glass: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
    --ink: #F2F5F7; --muted: #A7AEB8; --faint: #6B7380;
    --signal: #3DDC97; --on-signal: #06110C;
    --display: "Clash Display", "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center; position: relative;
    background: var(--base); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; padding: 40px 24px; text-align: center; overflow: hidden;
  }
  .orbs { position: fixed; inset: 0; pointer-events: none; }
  .orbs i { position: absolute; border-radius: 50%; filter: blur(90px); width: 52vw; height: 52vw; left: -16vw; top: -24vw; background: radial-gradient(circle, rgba(61,220,151,.12), transparent 65%); }
  main { position: relative; }
  .mark { display: inline-block; margin-bottom: 34px; }
  .code { font-family: var(--display); font-weight: 600; letter-spacing: -0.03em; font-size: clamp(96px, 20vw, 200px); line-height: 1; user-select: none; }
  .code em { font-style: normal; color: var(--signal); }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(21px, 3vw, 28px); letter-spacing: -0.01em; margin: 22px 0 12px; }
  p { color: var(--muted); max-width: 42ch; margin: 0 auto 34px; font-size: 16.5px; line-height: 1.6; }
  a.home {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    background: var(--signal); color: var(--on-signal); border-radius: 100px; padding: 8px 8px 8px 22px;
    text-decoration: none; transition: background .2s var(--ease-out), transform .12s var(--ease-out);
  }
  a.home:hover { background: #5CE6AC; }
  a.home:active { transform: scale(.98); }
  a.home .island { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(6,17,12,.16); transition: transform .22s var(--ease-out); }
  a.home:hover .island { transform: translate(2px, -2px) scale(1.06); }
  .fine { position: absolute; bottom: 22px; left: 0; right: 0; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  @media print { .orbs { display: none; } a.home { border: 1px solid #000; background: none; color: #000; } body { background: #fff; color: #000; } p { color: #333; } }
</style>
