# Human-in-the-loop agentic bug intake and fixing — MedWork LOMN
# Every bug lands as one ClickUp ticket. Narrowly-scoped agents reproduce,
# scope, fix, and verify it in an isolated worktree; a human verifies before
# production. Every agent carries an alert-a-human escape hatch.
name: Bug intake & agentic fixing
description: From first report to production — intake channels converge on one ClickUp ticket, cron agents convert and triage it, a fix ships from an isolated worktree, and humans verify twice. Each step names the ClickUp status it implies. Every agent can alert a human at any time, for any reason.

nodes:
  # ── people
  - id: reporter
    type: role
    label: Reporter
    description: Anyone on the team who spots a bug.

  - id: joe
    type: role
    label: Joe
    description: Final human verification and the production merge.

  - id: opener
    type: role
    label: Kelsey / Chandra
    description: Whoever opened the ticket verifies the fix in sandbox before it ships.

  # ── intake channels (human)
  - id: intake-clickup
    type: process
    label: Report in ClickUp
    automation: manual
    owner: Reporter
    description: Someone opens a ClickUp ticket by hand. ClickUp status — To do.

  - id: intake-whatsapp
    type: process
    label: Report via WhatsApp
    automation: manual
    owner: Reporter
    systems: [ WhatsApp ]
    description: Someone messages Joe about a bug. Captured into ClickUp — status To do.

  - id: intake-phone
    type: process
    label: Report by phone
    automation: manual
    owner: Reporter
    description: Someone describes the bug on a call. Captured into ClickUp — status To do.

  - id: capture
    type: process
    label: Capture as one ClickUp ticket
    automation: manual
    owner: Joe
    systems: [ ClickUp ]
    description: Every channel converges here — one ticket per bug, the single intake queue. Also where "can't reproduce" and failed verifications return for more detail. ClickUp status — To do.

  - id: ticket
    type: artifact
    label: ClickUp ticket
    systems: [ ClickUp ]
    description: Expected behavior, current behavior, repro context, links. Status moves with the process — To do, In progress, Verifying, Closed.

  # ── agents: convert, watch, triage
  - id: hermes
    type: process
    label: Convert ticket to GitHub issue
    automation: automated
    owner: Hermes agent
    trigger: Cron — every 30 min
    systems: [ ClickUp, GitHub ]
    description: Hermes scans ClickUp for new tickets and opens a matching GitHub issue. Escape hatch — alert-a-human tool, any time. ClickUp status moves to In progress.

  - id: gh-issue
    type: artifact
    label: GitHub issue
    systems: [ GitHub ]
    description: The working unit for the fix agents, assigned to Joe.

  - id: watcher
    type: process
    label: Pick up new assigned issues
    automation: automated
    owner: Watcher agent
    trigger: Cron — every 30 min
    systems: [ GitHub ]
    description: A second cron agent looks for new GitHub issues assigned to Joe and starts triage. Escape hatch — alert a human any time.

  - id: triage
    type: process
    label: Reproduce the bug
    automation: automated
    owner: Triage agent
    systems: [ MedWork LOMN sandbox ]
    description: Reproduction comes first — no fix without knowing what broken looks like. Documents expected behavior vs current behavior, then attempts reproduction. Escape hatch — alert a human.

  - id: reproduced
    type: decision
    label: Reproduced?
    automation: automated
    description: If the bug cannot be reproduced, the ticket goes back to intake for more detail and a human is alerted.

  # ── scope and fix
  - id: explore
    type: process
    label: Explore and scope the fix
    automation: automated
    owner: Explorer agent
    description: Reads the code, names what is broken, which components are affected, and the minimum viable fix. Scoped narrowly — no refactor expeditions for a CSS bug.

  - id: fix
    type: process
    label: Fix in an isolated worktree
    automation: automated
    owner: Fix agent
    description: The smallest change that fixes the bug, in a separate git worktree so parallel agents never collide. Escape hatch — alert a human.

  # ── verification, twice by agents, then by humans
  - id: verify
    type: process
    label: Verify the fix
    automation: automated
    owner: Verifier agent
    systems: [ MedWork LOMN sandbox ]
    description: A fresh agent verifies in code and visually — it drives a browser through the workflow on the MedWork LOMN site only. Narrowly scoped — no web access beyond that site.

  - id: verified
    type: decision
    label: Fix verified?
    automation: automated
    description: Code checks pass and the browser run-through shows the expected behavior.

  - id: review
    type: process
    label: Adversarial review
    automation: automated
    owner: Review agents
    description: Independent review — the fix stayed in scope, changed nothing else, the original reproduction now fails, and the expected behavior holds.

  - id: review-passed
    type: decision
    label: Review passed?
    automation: automated

  - id: mark-verifying
    type: process
    label: Move ticket to Verifying
    automation: automated
    systems: [ ClickUp ]
    description: The ticket advances with repro steps and proof attached — how it was reproduced before, and why it cannot be reproduced now. ClickUp status — Verifying.

  - id: human-verify
    type: process
    label: Joe verifies and opens a PR
    automation: manual
    owner: Joe
    systems: [ GitHub ]
    description: A human confirms the fix holds and opens the pull request.

  - id: pr
    type: artifact
    label: Pull request
    systems: [ GitHub ]

  - id: merge-sandbox
    type: process
    label: Merge to sandbox
    automation: manual
    owner: Joe
    description: The PR merges into the sandbox line and the ticket goes back to whoever opened it. ClickUp status — Verifying.

  - id: opener-verify
    type: process
    label: Opener verifies in sandbox
    automation: manual
    owner: Kelsey / Chandra
    description: The person who reported the bug confirms it behaves as expected where they first saw it break.

  - id: expected
    type: decision
    label: Behaves as expected?
    automation: manual

  - id: ship
    type: process
    label: Merge to production
    automation: manual
    owner: Joe
    description: Merge to main and deploy. Ticket closes. ClickUp status — Closed.

edges:
  - from: reporter
    to: intake-clickup
    label: opens
  - from: reporter
    to: intake-whatsapp
    label: messages
  - from: reporter
    to: intake-phone
    label: calls
  - from: intake-clickup
    to: capture
  - from: intake-whatsapp
    to: capture
  - from: intake-phone
    to: capture
  - from: capture
    to: ticket
    label: one per bug
  - from: ticket
    to: hermes
    label: new tickets
  - from: hermes
    to: gh-issue
    label: opens
  - from: gh-issue
    to: watcher
    label: assigned to Joe
  - from: watcher
    to: triage
  - from: triage
    to: reproduced
  - from: reproduced
    to: capture
    label: no — alert a human
    via: { x: 1204, y: 190 }
  - from: reproduced
    to: explore
    label: yes
  - from: explore
    to: fix
    label: minimum viable fix
  - from: fix
    to: verify
  - from: verify
    to: verified
  - from: verified
    to: fix
    label: no — fix again
  - from: verified
    to: review
    label: yes
  - from: review
    to: review-passed
  - from: review-passed
    to: fix
    label: no
  - from: review-passed
    to: mark-verifying
    label: yes
  - from: mark-verifying
    to: human-verify
  - from: joe
    to: human-verify
    label: verifies
  - from: human-verify
    to: pr
    label: opens
  - from: pr
    to: merge-sandbox
  - from: merge-sandbox
    to: opener-verify
    label: assigned back
  - from: opener
    to: opener-verify
    label: verifies
  - from: opener-verify
    to: expected
  - from: expected
    to: capture
    label: no — reopens the ticket
  - from: expected
    to: ship
    label: yes
