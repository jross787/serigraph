# Atlas Logistics — Order Flow (seeded example)
# A consulting engagement map of the order-to-cash process: intake, credit
# hold, allocation, warehouse, and billing. Every integration handoff names
# how the data moves (kind: api | file | manual | event); the one confirmed
# problem is marked with issue:. Seeded demo data, not a real client.
name: Atlas Logistics — Order Flow
description: How a customer order moves from intake through credit, allocation, and the warehouse to invoicing — and where the billing handoff keeps breaking.

nodes:
  - id: order-intake
    type: process
    label: Order intake
    description: Customer service enters new orders from email and phone into the ERP during the call. About 1,400 orders a month.
    owner: Customer service
    systems: [ Infor ERP ]
    cost: { runs: 1400 }

  - id: erp
    type: system
    label: Infor ERP
    description: Source of truth for customers, orders, inventory, and invoices. Runs the credit check on every new order.

  - id: credit-check
    type: decision
    label: Credit OK?

  - id: hold-review
    type: process
    label: Review credit hold
    description: The credit team works the hold queue each morning — checking open balances and payment history before releasing an order.
    owner: Credit team
    automation: manual
    trigger: Daily 8am

  - id: credit-team
    type: role
    label: Credit team
    description: Two analysts who own credit limits, holds, and releases.

  - id: allocate
    type: process
    label: Allocate inventory
    description: The ERP reserves stock for released orders and builds the pick wave for the warehouse.
    automation: automated

  - id: wms
    type: system
    label: Manhattan WMS
    description: Warehouse management system. Receives pick waves, directs pickers by scan gun, and confirms shipments back to the ERP.

  - id: pick-pack
    type: process
    label: Pick & pack
    description: Warehouse staff pick each order by scan gun and pack it for the booked carrier.
    owner: Warehouse team
    automation: manual
    cost: { runs: 1400 }

  - id: ship
    type: process
    label: Ship order
    description: The carrier collects packed orders; the WMS fires a shipment webhook with the tracking number.
    automation: automated

  - id: billing
    type: process
    label: Generate invoices
    description: Billing runs nightly over the day's shipment file and emails invoices from the ERP.
    automation: automated
    trigger: Nightly 1am

  - id: invoice
    type: artifact
    label: Customer invoice
    description: The invoice PDF emailed to the customer and posted to the finance ledger.

  - id: billing-lead
    type: role
    label: Billing lead
    description: Owns billing exceptions and the dispute queue when invoices go out short.
  - id: lead-form
    type: system
    label: Web Form
    description: The marketing site's lead or demo-request form that posts new prospects into intake.
  - id: lead-inbox
    type: system
    label: Shared Inbox
    description: The shared sales inbox (e.g. sales@) where prospects email in directly.
  - id: lead-capture
    type: process
    label: Capture & Parse
    description: Pull each raw lead from its channel, extract the contact fields, and normalize them before matching.
    children:
      nodes:
        - id: lead-parse
          type: process
          label: Extract Fields
          description: Read name, company, email, phone and message out of the form payload or email body.
        - id: lead-normalize
          type: process
          label: Normalize
          description: Standardize company name, email casing and phone format so matching is reliable.
        - id: lead-validate
          type: decision
          label: Complete contact?
          description: Check that the minimum viable fields (name plus a work email or phone) are present.
        - id: lead-bounce
          type: process
          label: Request Missing Info
          description: Auto-reply asking for the missing details, or hold the lead for manual review.
      edges:
        - from: lead-parse
          to: lead-normalize
          label: raw fields
        - from: lead-normalize
          to: lead-validate
        - from: lead-validate
          to: lead-bounce
          label: incomplete
  - id: lead-dedupe
    type: decision
    label: Duplicate contact?
    description: Search the CRM for an existing contact or account matching this email or domain.
  - id: lead-create
    type: process
    label: Create Lead Record
    description: Create a brand-new lead or contact when no match exists.
  - id: lead-merge
    type: process
    label: Merge Into Existing
    description: Attach the new activity to the matched contact or account instead of duplicating it.
  - id: lead-crm
    type: system
    label: The CRM
    description: The system of record where leads, contacts and accounts live (Salesforce, HubSpot, etc.).
  - id: lead-record
    type: artifact
    label: Lead Record
    description: The saved CRM lead with source, timestamp and captured fields, ready for assignment.
  - id: lead-route
    type: decision
    label: Route by segment
    description: Apply routing rules by deal size, territory or product interest to pick the owner.
  - id: lead-ae
    type: role
    label: Account Executive
    description: Owns enterprise or high-intent leads and works them directly.
  - id: lead-sdr
    type: role
    label: Sales Development Rep
    description: Owns SMB and self-serve leads for first-touch qualification.

edges:
  - from: order-intake
    to: erp
    kind: api
    label: saves order
  - from: erp
    to: credit-check
    kind: api
    label: credit lookup
  - from: credit-check
    to: allocate
    label: approved
  - from: credit-check
    to: hold-review
    label: held
  - from: credit-team
    to: hold-review
    kind: manual
    label: works queue
  - from: hold-review
    to: allocate
    kind: manual
    label: releases order
  - from: allocate
    to: wms
    kind: api
    label: pick wave
  - from: wms
    to: pick-pack
    kind: manual
    label: scan-directed work
  - from: pick-pack
    to: ship
    label: packed
  - from: ship
    to: erp
    kind: event
    label: shipment webhook
  - from: erp
    to: billing
    kind: file
    label: nightly shipment file
    issue: The nightly shipment file silently drops partial-shipment lines, so split orders are invoiced short until a customer disputes the bill.
  - from: billing
    to: invoice
    kind: api
    label: emails invoice
  - from: billing-lead
    to: billing
    kind: manual
    label: works exceptions
  - from: lead-form
    to: lead-capture
    label: form submission
  - from: lead-inbox
    to: lead-capture
    label: email lead
  - from: lead-capture
    to: lead-dedupe
  - from: lead-dedupe
    to: lead-create
    label: no match
  - from: lead-dedupe
    to: lead-merge
    label: existing match
  - from: lead-create
    to: lead-crm
    label: writes new record
  - from: lead-merge
    to: lead-crm
    label: updates record
  - from: lead-crm
    to: lead-record
    label: produces
  - from: lead-record
    to: lead-route
  - from: lead-route
    to: lead-ae
    label: enterprise
  - from: lead-route
    to: lead-sdr
    label: SMB / self-serve
