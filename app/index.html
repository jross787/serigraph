<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serigraph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='12' height='9' rx='2.5' fill='%233b82f6'/%3E%3Crect x='19' y='4' width='11' height='8' rx='2.5' fill='%2310b981'/%3E%3Crect x='18' y='19' width='12' height='9' rx='2.5' fill='%23f59e0b'/%3E%3Cpath d='M14 12.5 19 9M14 13.5l4 8' stroke='%2394a3b8' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/styles.css">
<script src="/vendor/dagre.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <a class="logo" href="#/" title="Serigraph">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <rect x="2" y="8" width="12" height="9" rx="2.5" class="lg-a"/>
          <rect x="19" y="4" width="11" height="8" rx="2.5" class="lg-b"/>
          <rect x="18" y="19" width="12" height="9" rx="2.5" class="lg-c"/>
          <path d="M14 12.5 19 9M14 13.5l4 8" class="lg-l"/>
        </svg>
        <span class="logo-word">Serigraph</span>
      </a>
      <button id="map-switcher" class="tb-btn map-switcher" title="Switch map">
        <span id="map-switcher-name">…</span>
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="map-mode" class="tb-btn map-mode" title="Choose how this map works" aria-haspopup="menu">
        <span id="map-mode-label">Process</span>
        <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <nav id="breadcrumbs" aria-label="Map hierarchy"></nav>
      <nav id="workspace-switcher" aria-label="Document views">
        <button data-view="map" class="active" aria-pressed="true">Map</button>
        <button data-view="brief" aria-pressed="false">Brief</button>
        <button data-view="roadmap" aria-pressed="false">Roadmap</button>
        <button data-view="audit" aria-pressed="false">Audit</button>
      </nav>
    </div>
    <div class="tb-right">
      <button id="btn-search" class="tb-btn search-btn" title="Search nodes (⌘K)">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>⌘K</kbd>
      </button>
      <button id="btn-present" class="tb-btn present-btn" title="Present (Shift+P)">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
        <span>Present</span>
      </button>
      <button id="btn-ai" class="tb-btn ai-btn" title="Ask AI to edit this map">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="currentColor"/></svg>
        <span>AI</span>
      </button>
      <button id="btn-add-node" class="tb-btn primary" title="Add a node (N)"><span aria-hidden="true">＋</span> <span id="btn-add-node-label">Add step</span></button>
      <details class="utility-menu">
        <summary class="tb-btn icon-btn" title="More actions" aria-label="More actions">•••</summary>
        <div class="utility-popover">
          <button id="btn-templates" class="menu-item" title="Template library">Templates</button>
          <button id="btn-import" class="menu-item" title="New map from a meeting transcript">Import transcript</button>
          <button id="btn-import-file" class="menu-item" title="Open a Serigraph YAML file from disk">Import file…</button>
          <button id="btn-export-file" class="menu-item" title="Download this map as a YAML file">Export file</button>
          <button id="btn-ai-settings" class="menu-item" title="Provider, key, and models for the AI assistant">AI settings</button>
          <button id="btn-economics" class="menu-item" title="Compare human and agent cost">Economics</button>
          <button id="btn-share" class="menu-item" title="Copy a deep link or download the map">Share & export</button>
          <button id="btn-history" class="menu-item" title="Restore a local revision">Revision recovery</button>
          <button id="btn-theme" class="menu-item" title="Toggle theme">Toggle appearance</button>
          <button id="btn-help" class="menu-item" title="Keyboard shortcuts (?)">Keyboard shortcuts</button>
        </div>
      </details>
    </div>
  </header>

  <div id="main-row">
    <aside id="templates-panel" hidden></aside>
    <main id="stage">
      <section id="product-workspace" hidden aria-label="Product document"></section>
      <svg id="canvas" tabindex="0" role="application" aria-label="Map canvas"></svg>
      <nav id="tool-rail" aria-label="Map tools"></nav>
      <div id="tool-flyout" hidden></div>
      <div id="context-actions" hidden aria-label="Selected item actions"></div>
      <div id="scenario-preview" hidden aria-live="polite"></div>
      <aside id="probe-panel" hidden aria-live="polite"></aside>
      <aside id="review-tray" hidden aria-label="Review trail"></aside>
      <div id="zoombar">
        <button id="zoom-out" title="Zoom out (−)">−</button>
        <button id="zoom-fit" title="Fit to view (0)">⛶</button>
        <button id="zoom-in" title="Zoom in (+)">+</button>
      </div>
      <div id="palette" hidden></div>
      <div id="moveout-bar" hidden></div>
      <div id="economics" hidden></div>
      <div id="minimap" hidden><svg></svg></div>
      <div id="canvas-msg" hidden></div>
    </main>
    <aside id="detail" hidden></aside>
    <aside id="chat-dock" hidden aria-label="Map assistant"></aside>
  </div>
  <div id="search-overlay" hidden></div>
  <div id="dialog-root"></div>
  <div id="present-hud" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="/app/main.js"></script>
</body>
</html>
