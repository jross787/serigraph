<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serigraph</title>
<link rel="icon" type="image/svg+xml" href="/app/serigraph-mark.svg">
<link rel="stylesheet" href="/app/styles.css">
<script src="/vendor/dagre.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <a class="logo" href="#/" title="Serigraph" aria-label="Serigraph home">
        <img class="logo-mark" src="/app/serigraph-mark.svg" width="24" height="24" alt="">
        <span class="logo-word">Serigraph</span>
      </a>
      <button id="btn-projects" class="tb-btn" title="Projects home">Projects</button>
      <button id="map-switcher" class="tb-btn map-switcher" title="Switch map">
        <span id="map-switcher-name">…</span>
        <svg data-icon="caret-down" width="12" height="12" aria-hidden="true"></svg>
      </button>
      <button id="map-mode" class="tb-btn map-mode" title="Choose how this map works" aria-haspopup="menu">
        <span id="map-mode-label">Process</span>
        <svg data-icon="caret-down" width="12" height="12" aria-hidden="true"></svg>
      </button>
      <nav id="breadcrumbs" aria-label="Map hierarchy"></nav>
      <button id="btn-catalog" class="tb-btn" hidden aria-controls="detail" aria-expanded="false">Data catalog</button>
      <nav id="workspace-switcher" aria-label="Document views">
        <button data-view="map" class="active" aria-pressed="true">Map</button>
        <button data-view="agents" aria-pressed="false">Agents</button>
        <button data-view="flow" aria-pressed="false">Flow</button>
        <button data-view="brief" aria-pressed="false">Brief</button>
        <button data-view="roadmap" aria-pressed="false">Roadmap</button>
        <button data-view="audit" aria-pressed="false">Audit</button>
      </nav>
    </div>
    <div class="tb-right">
      <button id="btn-search" class="tb-btn search-btn" title="Search nodes (⌘K)">
        <svg data-icon="magnifying-glass" width="18" height="18" aria-hidden="true"></svg>
        <span>Search</span><kbd>⌘K</kbd>
      </button>
      <button id="btn-present" class="tb-btn present-btn" title="Present (Shift+P)">
        <svg data-icon="play" width="18" height="18" aria-hidden="true"></svg>
        <span>Present</span>
      </button>
      <button id="btn-ai" class="tb-btn ai-btn" title="Ask AI to edit this map">
        <svg data-icon="sparkle" width="18" height="18" aria-hidden="true"></svg>
        <span>AI</span>
      </button>
      <details class="utility-menu">
        <summary class="tb-btn icon-btn" title="More actions" aria-label="More actions"><svg data-icon="dots-three" width="18" height="18" aria-hidden="true"></svg></summary>
        <div class="utility-popover">
          <button id="btn-templates" class="menu-item" title="Template library">Templates</button>
          <button id="btn-ai-settings" class="menu-item" title="Provider, key, and models for the AI assistant">AI settings</button>
          <button id="btn-economics" class="menu-item" title="Compare human and agent cost">Economics</button>
          <button id="btn-theme" class="menu-item" title="Toggle theme">Toggle appearance</button>
          <button id="btn-help" class="menu-item" title="Keyboard shortcuts (?)">Keyboard shortcuts</button>
        </div>
      </details>
    </div>
  </header>

  <div id="main-row">
    <aside id="templates-panel" hidden></aside>
    <main id="stage">
      <section id="product-workspace" hidden aria-label="Product document"></section>
      <section id="projects-home" hidden aria-label="Projects"></section>
      <svg id="canvas" tabindex="0" role="application" aria-label="Map canvas"></svg>
      <nav id="tool-rail" aria-label="Map editing toolbar"></nav>
      <div id="tool-flyout" hidden></div>
      <div id="context-actions" hidden aria-label="Selected item actions"></div>
      <div id="scenario-preview" hidden aria-live="polite"></div>
      <aside id="probe-panel" hidden aria-live="polite"></aside>
      <aside id="review-tray" hidden aria-label="Review trail"></aside>
      <div id="palette" hidden></div>
      <div id="moveout-bar" hidden></div>
      <div id="economics" hidden></div>
      <section id="agent-stage" hidden aria-label="Agent trail"></section>
      <div id="minimap" hidden><svg></svg></div>
      <div id="canvas-msg" hidden></div>
    </main>
    <aside id="detail" hidden></aside>
    <aside id="chat-dock" hidden aria-label="Map assistant"></aside>
  </div>
  <div id="search-overlay" hidden></div>
  <div id="dialog-root"></div>
  <div id="present-hud" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="/app/main.js"></script>
</body>
</html>
