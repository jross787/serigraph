<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opsmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='12' height='9' rx='2.5' fill='%233b82f6'/%3E%3Crect x='19' y='4' width='11' height='8' rx='2.5' fill='%2310b981'/%3E%3Crect x='18' y='19' width='12' height='9' rx='2.5' fill='%23f59e0b'/%3E%3Cpath d='M14 12.5 19 9M14 13.5l4 8' stroke='%2394a3b8' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/styles.css">
<script src="/vendor/dagre.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <a class="logo" href="#/" title="Opsmap">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <rect x="2" y="8" width="12" height="9" rx="2.5" class="lg-a"/>
          <rect x="19" y="4" width="11" height="8" rx="2.5" class="lg-b"/>
          <rect x="18" y="19" width="12" height="9" rx="2.5" class="lg-c"/>
          <path d="M14 12.5 19 9M14 13.5l4 8" class="lg-l"/>
        </svg>
        <span class="logo-word">Opsmap</span>
      </a>
      <button id="map-switcher" class="tb-btn map-switcher" title="Switch map">
        <span id="map-switcher-name">…</span>
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <nav id="breadcrumbs" aria-label="Map hierarchy"></nav>
    </div>
    <div class="tb-right">
      <button id="btn-search" class="tb-btn icon-btn" title="Search nodes (⌘K)">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-templates" class="tb-btn" title="Template library">Templates</button>
      <button id="btn-add-node" class="tb-btn primary" title="Add a node (N)">+ Node</button>
      <button id="btn-import" class="tb-btn" title="New map from a meeting transcript">✨ Import</button>
      <button id="btn-economics" class="tb-btn icon-btn" title="Economics — human vs. agent cost">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 2.5v19M16.5 5.5h-6.75a3 3 0 0 0 0 6h4.5a3 3 0 0 1 0 6H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-present" class="tb-btn icon-btn" title="Present (P)">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
      </button>
      <button id="btn-export" class="tb-btn icon-btn" title="Download standalone HTML">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-theme" class="tb-btn icon-btn" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="17" height="17" class="theme-sun"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" width="17" height="17" class="theme-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-help" class="tb-btn icon-btn" title="Keyboard shortcuts (?)">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.9c-.8.4-1 .9-1 1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div id="main-row">
    <aside id="templates-panel" hidden></aside>
    <main id="stage">
      <svg id="canvas" tabindex="0" role="application" aria-label="Operations map canvas"></svg>
      <div id="zoombar">
        <button id="zoom-out" title="Zoom out (−)">−</button>
        <button id="zoom-fit" title="Fit to view (0)">⛶</button>
        <button id="zoom-in" title="Zoom in (+)">+</button>
      </div>
      <div id="palette" hidden></div>
      <div id="moveout-bar" hidden></div>
      <div id="economics" hidden></div>
      <div id="minimap" hidden><svg></svg></div>
      <div id="canvas-msg" hidden></div>
    </main>
    <aside id="detail" hidden></aside>
  </div>
  <div id="search-overlay" hidden></div>
  <div id="dialog-root"></div>
  <div id="present-hud" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="/app/main.js"></script>
</body>
</html>
